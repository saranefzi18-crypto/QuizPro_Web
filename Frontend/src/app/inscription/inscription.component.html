<div class="div-form">
  <h1>Création d'un compte</h1>

  <label>Nom</label>
  <input type="text" [(ngModel)]="nom" required />
  <label>Prénom</label>
  <input type="text" [(ngModel)]="prenom" required />
  <label>Email</label>
  <input type="email" [(ngModel)]="email" required />
  <label>Mot de passe</label>
  <input type="motdepasse" [(ngModel)]="motdepasse" required />
  <label>Confirmer votre mot de passe</label>
  <input type="motdepasse" [(ngModel)]="confirmMotdePasse" required />
  <select [(ngModel)]="roles" required>
    <option value="Commercial">Commercial</option>
    <option value="Formateur">Formateur</option>
  </select>

  <p>{{ message }}</p>

  <button (click)="register()">S'INSCRIRE</button>

  <p>Vous avez déjà un compte ? <a routerLink="/login">Se connecter</a></p>
</div>
